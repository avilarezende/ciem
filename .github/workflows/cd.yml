name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: services/core/Dockerfile
          - name: portal
            dockerfile: services/portal/Dockerfile
          - name: proxy
            dockerfile: services/proxy/Dockerfile
          - name: module-zabbix
            dockerfile: services/modules/zabbix/Dockerfile
          - name: module-cacti
            dockerfile: services/modules/cacti/Dockerfile
          - name: module-nagios
            dockerfile: services/modules/nagios/Dockerfile
          - name: module-topdesk
            dockerfile: services/modules/topdesk/Dockerfile
          - name: module-inventory
            dockerfile: services/modules/inventory/Dockerfile
          - name: module-syslog
            dockerfile: services/modules/syslog/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

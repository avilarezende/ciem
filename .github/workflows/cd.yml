name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Publica em ghcr.io/avilarezende/ciem-<serviço> (usa o repositório GitHub atual)
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  publish-images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: services/core/Dockerfile
          - name: portal
            dockerfile: services/portal/Dockerfile
          - name: proxy
            dockerfile: services/proxy/Dockerfile
          - name: module-zabbix
            dockerfile: services/modules/zabbix/Dockerfile
          - name: module-cacti
            dockerfile: services/modules/cacti/Dockerfile
          - name: module-nagios
            dockerfile: services/modules/nagios/Dockerfile
          - name: module-topdesk
            dockerfile: services/modules/topdesk/Dockerfile
          - name: module-inventory
            dockerfile: services/modules/inventory/Dockerfile
          - name: module-syslog
            dockerfile: services/modules/syslog/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

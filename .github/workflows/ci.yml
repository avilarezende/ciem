name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Usa .gitleaks.toml na raiz (allowlist de fixtures históricas + .env local)
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Bandit (SAST — Python)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install --require-hashes -r requirements-security.lock
          bandit -q -r shared services --skip B101,B110,B311 -ll -f json -o bandit.json

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependências
        run: pip install --require-hashes -r requirements-dev.lock

      - name: pip-audit (OWASP A06 — componentes vulneráveis)
        run: |
          pip install --require-hashes -r requirements-security.lock
          # Audita apenas deps do projeto (não o ambiente do runner)
          pip-audit -r requirements.lock --disable-pip --no-deps --progress-spinner off

      - name: Ruff (lint)
        run: ruff check shared services/core services/modules tests

      - name: Pytest
        run: pytest tests -v
        env:
          # CONFIG_PATH real é sobrescrito pelo conftest (dir temporário com senhas de fixture).
          CONFIG_PATH: ./config
          PYTHONPATH: shared:services/core
          CIEM_SECRET_KEY: test-secret-key-for-ci-only
          CIEM_RATE_LIMIT_ENABLED: "0"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: services/core/Dockerfile
          - name: portal
            dockerfile: services/portal/Dockerfile
          - name: proxy
            dockerfile: services/proxy/Dockerfile
          - name: module-zabbix
            dockerfile: services/modules/zabbix/Dockerfile
          - name: module-cacti
            dockerfile: services/modules/cacti/Dockerfile
          - name: module-nagios
            dockerfile: services/modules/nagios/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build imagem Docker — ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ciem-${{ matrix.name }}:ci .

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar docker-compose.yml
        env:
          # Valores dummy apenas para validação de sintaxe (config --quiet).
          CIEM_TRUSTED_HOSTS: ciem.example.invalid
          CIEM_CORS_ORIGINS: https://ciem.example.invalid
          CIEM_SECRET_KEY: ci-secret-key-para-validacao
          CIEM_GRAFANA_TOKEN: ci-grafana-token-para-validacao
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

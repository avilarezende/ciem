name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bandit (SAST — Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -q -r shared services --skip B101,B110,B311 -f sarif -o bandit.sarif || true

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check shared services/core services/modules tests

      - name: Pytest
        run: pytest tests -v
        env:
          # CONFIG_PATH real é sobrescrito pelo conftest (dir temporário com senhas de fixture).
          CONFIG_PATH: ./config
          PYTHONPATH: shared:services/core
          CIEM_SECRET_KEY: test-secret-key-for-ci-only
          CIEM_RATE_LIMIT_ENABLED: "0"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: services/core/Dockerfile
          - name: portal
            dockerfile: services/portal/Dockerfile
          - name: proxy
            dockerfile: services/proxy/Dockerfile
          - name: module-zabbix
            dockerfile: services/modules/zabbix/Dockerfile
          - name: module-cacti
            dockerfile: services/modules/cacti/Dockerfile
          - name: module-nagios
            dockerfile: services/modules/nagios/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker — ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ciem-${{ matrix.name }}:ci .

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        env:
          # Valores dummy apenas para validação de sintaxe (config --quiet).
          CIEM_SECRET_KEY: ci-secret-key-para-validacao
          CIEM_GRAFANA_TOKEN: ci-grafana-token-para-validacao
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

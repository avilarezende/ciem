name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest tests -v
        env:
          PYTHONPATH: src

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker
        run: docker build -t ciem:ci .

      - name: Smoke test do container
        run: |
          docker run -d --name ciem-smoke -p 18000:8000 ciem:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs ciem-smoke
          exit 1

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

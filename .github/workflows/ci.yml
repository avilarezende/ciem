name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check shared services/core services/modules tests

      - name: Pytest
        run: pytest tests -v
        env:
          CONFIG_PATH: ./config
          PYTHONPATH: shared:services/core

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: services/core/Dockerfile
          - name: portal
            dockerfile: services/portal/Dockerfile
          - name: proxy
            dockerfile: services/proxy/Dockerfile
          - name: module-zabbix
            dockerfile: services/modules/zabbix/Dockerfile
          - name: module-cacti
            dockerfile: services/modules/cacti/Dockerfile
          - name: module-nagios
            dockerfile: services/modules/nagios/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build imagem Docker — ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ciem-${{ matrix.name }}:ci .

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Validar docker-compose.yml
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

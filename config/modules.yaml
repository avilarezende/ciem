# =============================================================================
# Módulos do Conversador PoP-SE
# -----------------------------------------------------------------------------
# enabled: true/false — controla quais coletores/canais o módulo sources executa
# e quais profiles Docker você deve subir (ver docker-compose.yml).
#
# Canais: cada um requer credenciais no .env e profile docker correspondente.
# Fontes RAG: requerem credenciais no .env e profile "sources".
# =============================================================================

canais:
  web:
    enabled: true
    description: "Página web de chat — sempre ativa no profile core"

  whatsapp:
    enabled: false
    description: "WhatsApp via webhook (Evolution API ou similar). Profile: whatsapp"

  telegram:
    enabled: false
    description: "Bot Telegram. Profile: telegram. Requer TELEGRAM_BOT_TOKEN"

  discord:
    enabled: false
    description: "Bot Discord. Profile: discord. Requer DISCORD_BOT_TOKEN"

fontes_rag:
  popse_site:
    enabled: true
    description: "Contexto institucional de https://www.pop-se.rnp.br (sem credenciais)"

  zabbix:
    enabled: false
    description: "Manutenções programadas e problemas ativos. Requer ZABBIX_* no .env"

  cacti:
    enabled: false
    description: "Status de hosts e gráficos Cacti. Requer CACTI_* no .env"

  grafana:
    enabled: false
    description: "Alertas e anotações Grafana. Requer GRAFANA_URL e GRAFANA_API_KEY"

  mrtg:
    enabled: false
    description: "Tráfego MRTG — coletor a implementar"

  topdesk:
    enabled: false
    description: "Chamados Topdesk — coletor a implementar"

  email_microsoft:
    enabled: false
    description: "E-mails operacionais via Graph API. Profile: email"

infra:
  ollama:
    enabled: true
    description: "LLM local gratuito — desative se usar apenas provedor remoto"
  postgres:
    enabled: true
  chroma:
    enabled: true
    description: "Base vetorial para RAG"

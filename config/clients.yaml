# =============================================================================
# Instituições clientes do PoP-SE
# -----------------------------------------------------------------------------
# Este arquivo é montado como volume no Docker (config/clients.yaml).
# Alterações aqui entram em vigor após reiniciar o engine — sem rebuild.
#
# O conversador usa este cadastro para:
#   - Validar vínculo do usuário com a instituição informada na conversa
#   - Filtrar consultas de status de link e manutenções por instituição
#   - Cruzar aliases (siglas alternativas) com nomes citados pelo usuário
# =============================================================================

instituicoes:
  - sigla: IFS
    # Nome completo exibido nas respostas do bot
    nome: "Instituto Federal de Sergipe"
    # Variações que o usuário pode usar ao se identificar
    aliases: ["IFS", "Instituto Federal Sergipe", "IF Sergipe"]
    links_monitorados:
      - id: ifs-principal
        descricao: "Link principal IFS"
        # Nome do host no Zabbix — deve coincidir com o cadastro do monitoramento
        zabbix_host: "ifs-link-principal"
        # ID numérico do device no Cacti (opcional)
        cacti_device_id: null
        # Nome da operadora do circuito (opcional, para respostas contextualizadas)
        operadora: ""
        # Identificador do circuito junto à operadora (opcional)
        circuito_id: ""
    # Contatos técnicos da instituição (opcional, para referência do bot)
    contatos_tecnicos: []
      # - nome: "Rodrigo"
      #   email: "rodrigo@ifs.edu.br"
      #   telefone: "+55 79 99999-0000"

  - sigla: UFS
    nome: "Universidade Federal de Sergipe"
    aliases: ["UFS", "Universidade Federal Sergipe"]
    links_monitorados:
      - id: ufs-campus
        descricao: "Link campus UFS"
        zabbix_host: "ufs-campus"
        cacti_device_id: null
    contatos_tecnicos: []

  - sigla: UNIT
    nome: "Universidade Tiradentes"
    aliases: ["UNIT", "Tiradentes"]
    links_monitorados: []

  - sigla: UNEAL
    nome: "Universidade Estadual de Alagoas"
    aliases: ["UNEAL"]
    links_monitorados: []

# Para adicionar nova instituição, copie um bloco acima e preencha:
#   sigla, nome, aliases, links_monitorados (com zabbix_host se aplicável)

# =============================================================================
# CIEM — Autenticação e Autorização
# =============================================================================
# Papéis: observer (leitura) | admin (configuração + manutenção)
#
# Usuários locais funcionam INDEPENDENTEMENTE do LDAP.
# O usuário "admin" é o administrador padrão — altere a senha em produção.
#
# Alterar senha (CLI):
#   export PYTHONPATH=shared
#   python -c "from ciem_common.auth import hash_password; print(hash_password('nova_senha'))"
#
# Ou use o portal: Configuração → Usuários locais → Alterar senha
# Documentação: docs/AUTH.md
# =============================================================================

# ---------------------------------------------------------------------------
# Usuários locais (sempre disponíveis, independente do LDAP)
# ---------------------------------------------------------------------------
local_users:
  - username: admin
    # Senha padrão: admin123 — ALTERE IMEDIATAMENTE em produção!
    password_hash: "3f543d2874b37afc8c9fe320f42d007d$5969a05d3d97bffe372fddcff4858b3d3f1e1df560271698725432cba913abb3"
    role: admin
    enabled: true

  - username: observador
    # Senha padrão: observer123 — ALTERE em produção!
    password_hash: "2edb4297ff3021e8afbdfc777d398d0b$7c94998eaefd5a7018d544d07841eb93413cc731f46820e91ffe50cb012ac276"
    role: observer
    enabled: true

# ---------------------------------------------------------------------------
# LDAP / Active Directory (opcional)
# Deixe enabled: false para usar apenas usuários locais.
# ---------------------------------------------------------------------------
ldap:
  enabled: false
  host: "ldap.exemplo.local"
  port: 636
  use_ssl: true
  # URL completa (opcional; se vazia, montada de host/port/use_ssl)
  server_url: "ldaps://ldap.exemplo.local:636"
  domain: "exemplo.local"
  base_dn: "ou=usuarios,dc=exemplo,dc=local"
  uid_attribute: "uid"            # uid | sAMAccountName | cn
  user_filter: "(uid=%s)"         # %s = username do login
  bind_dn: "cn=ciem-service,ou=servicos,dc=exemplo,dc=local"
  bind_password: ""               # ou LDAP_BIND_PASSWORD no .env
  ca_cert_path: ""                # certificado CA / cadeia PEM
  client_cert_path: ""            # certificado cliente (opcional)
  display_name_attribute: "cn"
  group_role_mapping:
    "cn=ciem-admins,ou=grupos,dc=exemplo,dc=local": admin
    "cn=ciem-observers,ou=grupos,dc=exemplo,dc=local": observer
  default_role: observer
  verify_ssl: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciem-portal
  namespace: ciem
  labels:
    app: ciem-portal
    app.kubernetes.io/part-of: ciem-ztna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ciem-portal
  template:
    metadata:
      labels:
        app: ciem-portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/avilarezende/ciem-portal:main
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: ciem-portal
  namespace: ciem
spec:
  selector:
    app: ciem-portal
  ports:
    - name: http
      port: 80
      targetPort: 80

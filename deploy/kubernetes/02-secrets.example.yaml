# COPIE para 02-secrets.yaml, preencha em base64 e NÃO commite valores reais.
---
apiVersion: v1
kind: Secret
metadata:
  name: ciem-secrets
  namespace: ciem
type: Opaque
stringData:
  CIEM_SECRET_KEY: "altere-esta-chave-secreta"
  CIEM_GRAFANA_TOKEN: "ciem-grafana-internal"
  ZABBIX_USERNAME: "Admin"
  ZABBIX_PASSWORD: "zabbix"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: ciem
type: Opaque
stringData:
  admin-user: admin
  admin-password: "altere-senha-grafana"
---
# TLS wildcard — substitua pelos seus certificados (base64) ou use cert-manager
apiVersion: v1
kind: Secret
metadata:
  name: ciem-wildcard-tls
  namespace: ciem
type: kubernetes.io/tls
data:
  tls.crt: ""  # base64 do certificado
  tls.key: ""  # base64 da chave privada

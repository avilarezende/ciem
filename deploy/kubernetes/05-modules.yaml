# Coletores isolados — porta interna 8080 (igual ao Docker Compose)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-zabbix
  namespace: ciem
  labels:
    app: module-zabbix
    ciem.module: zabbix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module-zabbix
  template:
    metadata:
      labels:
        app: module-zabbix
        ciem.module: zabbix
    spec:
      containers:
        - name: zabbix
          image: ghcr.io/avilarezende/ciem-module-zabbix:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /app/config
            - name: ZABBIX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ciem-secrets
                  key: ZABBIX_USERNAME
                  optional: true
            - name: ZABBIX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ciem-secrets
                  key: ZABBIX_PASSWORD
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
      volumes:
        - name: config
          configMap:
            name: ciem-config
---
apiVersion: v1
kind: Service
metadata:
  name: module-zabbix
  namespace: ciem
spec:
  selector:
    app: module-zabbix
  ports:
    - port: 8080
      targetPort: 8080

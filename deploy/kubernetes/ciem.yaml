apiVersion: v1
kind: Namespace
metadata:
  name: ciem
  labels:
    app.kubernetes.io/name: ciem
    app.kubernetes.io/part-of: ciem-ztna
---
# ConfigMap com arquivos de configuração (monte seus YAMLs aqui)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ciem-config
  namespace: ciem
data:
  main.yaml: |
    platform_name: CIEM
    environment: production
    log_level: INFO
    collection_interval_seconds: 300
    audit_log_path: /data/audit/sessions.jsonl
---
# Core API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciem-core
  namespace: ciem
  labels:
    app: ciem-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ciem-core
  template:
    metadata:
      labels:
        app: ciem-core
    spec:
      containers:
        - name: core
          image: ghcr.io/avilarezende/ciem:main
          ports:
            - containerPort: 8000
          env:
            - name: CONFIG_PATH
              value: /app/config
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: audit
              mountPath: /data/audit
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: ciem-config
        - name: audit
          persistentVolumeClaim:
            claimName: ciem-audit-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ciem-core
  namespace: ciem
spec:
  selector:
    app: ciem-core
  ports:
    - port: 8000
      targetPort: 8000
---
# Módulo Zabbix (exemplo — replique para outros módulos)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-zabbix
  namespace: ciem
  labels:
    app: module-zabbix
    ciem.module: zabbix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module-zabbix
  template:
    metadata:
      labels:
        app: module-zabbix
        ciem.module: zabbix
    spec:
      containers:
        - name: zabbix
          image: ghcr.io/avilarezende/ciem-module-zabbix:main
          ports:
            - containerPort: 8101
          env:
            - name: CONFIG_PATH
              value: /app/config
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: ciem-config
---
apiVersion: v1
kind: Service
metadata:
  name: module-zabbix
  namespace: ciem
spec:
  selector:
    app: module-zabbix
  ports:
    - port: 8101
      targetPort: 8101
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ciem-audit-pvc
  namespace: ciem
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# Ingress com TLS wildcard
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ciem-ingress
  namespace: ciem
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ciem.exemplo.local
      secretName: ciem-wildcard-tls
  rules:
    - host: ciem.exemplo.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ciem-core
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ciem-portal
                port:
                  number: 80

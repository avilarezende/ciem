# CIEM Proxy — instância isolada de proxy reverso
# Termina SSL (wildcard) e roteia para core, portal, grafana e guacamole
# Guacamole protegido por SSO via auth_request → CIEM /sso/validate

upstream ciem_core {
    server ciem-core:8000;
}

upstream ciem_portal {
    server ciem-portal:80;
}

upstream ciem_grafana {
    server grafana:3000;
}

upstream ciem_guacamole {
    server guacamole:8080;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ciem/certs/wildcard.crt;
    ssl_certificate_key /etc/ciem/certs/wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Validação SSO interna (nginx auth_request)
    location = /internal/sso-validate {
        internal;
        proxy_pass http://ciem_core/sso/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        proxy_pass http://ciem_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://ciem_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /grafana/ {
        proxy_pass http://ciem_grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Guacamole — exige SSO CIEM (cookie ciem_sso)
    location /guacamole/ {
        auth_request /internal/sso-validate;
        auth_request_set $ciem_user $upstream_http_x_ciem_user;

        proxy_pass http://ciem_guacamole/guacamole/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-CIEM-User $ciem_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Página de erro SSO — redireciona ao portal
    error_page 401 403 = @sso_required;
    location @sso_required {
        return 302 /?sso_required=1;
    }
}

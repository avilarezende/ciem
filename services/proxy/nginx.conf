# CIEM Proxy — instância isolada de proxy reverso
# Termina SSL (wildcard) e roteia para core, portal, grafana e guacamole

upstream ciem_core {
    server ciem-core:8000;
}

upstream ciem_portal {
    server ciem-portal:80;
}

upstream ciem_grafana {
    server grafana:3000;
}

upstream ciem_guacamole {
    server guacamole:8080;
}

# Redirecionamento HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Certificado wildcard — monte via volume em /etc/ciem/certs/
    ssl_certificate     /etc/ciem/certs/wildcard.crt;
    ssl_certificate_key /etc/ciem/certs/wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Portal web (interface de configuração e dashboard)
    location / {
        proxy_pass http://ciem_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Core
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://ciem_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Grafana (painel de visualização)
    location /grafana/ {
        proxy_pass http://ciem_grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Guacamole (sessões SSH/RDP/VNC)
    location /guacamole/ {
        proxy_pass http://ciem_guacamole/guacamole/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

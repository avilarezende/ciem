[project]
name = "ciem"
version = "0.2.0"
description = "Centro Integrado de Estatística e Manutenção — plataforma ZTNA"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["shared", "services/core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared", "services/core", "services/modules", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
